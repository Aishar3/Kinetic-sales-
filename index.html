<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic — Simple Dev Console</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #020409;
      --bg-card: rgba(11, 17, 32, 0.8);
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-secondary: #00d2ff;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border-color: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.05) 0px, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      background-attachment: fixed;
    }

    /* Container */
    .app-container {
      width: 100%;
      max-width: 1100px;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    /* Header styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 2.25rem;
      height: 2.25rem;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-email {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 440px;
      margin: 4rem auto;
      text-align: left;
    }

    .card h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    /* Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      background: #060b18;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      width: 100%;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: auto;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    /* Dashboard Layout */
    .dashboard {
      display: none;
      width: 100%;
      text-align: left;
      animation: fadeIn 0.4s ease-out forwards;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      margin-top: 1rem;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .panel h3 {
      font-family: 'Outfit', sans-serif;
      margin-bottom: 1.25rem;
      font-size: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.75rem;
    }

    /* Leads Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }

    .lead-status {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-new { background: rgba(0, 210, 255, 0.1); color: var(--color-secondary); }
    .status-contacted { background: rgba(245, 158, 11, 0.1); color: var(--color-warning); }
    .status-qualified { background: rgba(37, 99, 235, 0.1); color: var(--color-primary); }
    .status-won { background: rgba(16, 185, 129, 0.1); color: var(--color-success); }
    .status-lost { background: rgba(239, 68, 68, 0.1); color: var(--color-danger); }

    .lead-value {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      color: var(--color-secondary);
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      display: none;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">K</div>
        <div class="brand-title">KINETIC</div>
      </div>
      <div class="user-badge" id="userBadge" style="display: none;">
        <span class="user-email" id="userEmailDisplay"></span>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- Login View -->
    <div id="loginView" class="card">
      <h2>API Console Access</h2>
      <p>Authenticate with your Supabase credentials to access the sales data.</p>
      
      <div class="alert alert-danger" id="loginError"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="admin@kinetic.io" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="dashboard">
      <div class="grid">
        
        <!-- Leads List -->
        <div class="panel">
          <h3>Database Records (Leads)</h3>
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Company</th>
                  <th>Value</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="leadsTableBody">
                <!-- Appended dynamically -->
                <tr>
                  <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                    Loading lead records...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add Lead Form -->
        <div class="panel" style="height: fit-content;">
          <h3>Register New Lead</h3>
          <div class="alert alert-danger" id="addLeadError"></div>
          
          <form id="addLeadForm" onsubmit="handleAddLead(event)">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="leadName" placeholder="Sarah Connor" required>
            </div>
            <div class="form-group">
              <label>Company</label>
              <input type="text" id="leadCompany" placeholder="Cyberdyne Systems">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="leadEmail" placeholder="sarah@cyberdyne.com">
            </div>
            <div class="form-group">
              <label>Estimated Value (USD)</label>
              <input type="number" id="leadValue" placeholder="10000" required>
            </div>
            <div class="form-group">
              <label>Pipeline Stage</label>
              <select id="leadStatus">
                <option value="new">New</option>
                <option value="contacted">Contacted</option>
                <option value="qualified">Qualified</option>
                <option value="won">Won</option>
                <option value="lost">Lost</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Lead Record</button>
          </form>
        </div>

      </div>
    </div>

  </div>

  <script>
    const API_URL = 'http://localhost:3001/api/v1';

    // Check login status on page load
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      const email = localStorage.getItem('user_email');
      
      if (token && email) {
        showDashboard(email);
      }
    });

    function showDashboard(email) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      document.getElementById('userBadge').style.display = 'flex';
      document.getElementById('userEmailDisplay').textContent = email;
      loadLeads();
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user_email');
      window.location.reload();
    }

    // Auth Submission
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      
      errorDiv.style.display = 'none';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user_email', data.user.email);
          showDashboard(data.user.email);
        } else {
          errorDiv.textContent = data.error?.message || 'Authentication failed.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'API Server is offline. Please make sure backend is running.';
        errorDiv.style.display = 'block';
      }
    }

    // Load Leads
    async function loadLeads() {
      const token = localStorage.getItem('token');
      const tableBody = document.getElementById('leadsTableBody');

      try {
        const res = await fetch(`${API_URL}/leads`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          if (res.status === 401) logout();
          throw new Error('Failed to load leads');
        }

        const leads = await res.json();
        tableBody.innerHTML = '';

        if (leads.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                No lead records found. Register your first lead using the form on the right!
              </td>
            </tr>`;
          return;
        }

        leads.forEach(lead => {
          const valueUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 })
            .format(lead.estimatedValue / 100);

          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="font-weight: 600;">${escapeHTML(lead.name)}</td>
            <td style="color: var(--text-muted);">${escapeHTML(lead.company || 'N/A')}</td>
            <td class="lead-value">${valueUSD}</td>
            <td><span class="lead-status status-${lead.status}">${lead.status}</span></td>
          `;
          tableBody.appendChild(row);
        });

      } catch (err) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--color-danger); padding: 3rem;">
              Error connecting to API. Retrying in 5 seconds...
            </td>
          </tr>`;
        setTimeout(loadLeads, 5000);
      }
    }

    // Add Lead Submission
    async function handleAddLead(e) {
      e.preventDefault();
      const token = localStorage.getItem('token');
      const errorDiv = document.getElementById('addLeadError');
      
      const payload = {
        name: document.getElementById('leadName').value,
        company: document.getElementById('leadCompany').value || null,
        email: document.getElementById('leadEmail').value || null,
        estimatedValue: parseInt(document.getElementById('leadValue').value) * 100, // convert USD to cents
        status: document.getElementById('leadStatus').value
      };

      errorDiv.style.display = 'none';

      try {
        const res = await fetch(`${API_URL}/leads`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById('addLeadForm').reset();
          loadLeads();
        } else {
          const data = await res.json();
          errorDiv.textContent = data.error?.message || 'Failed to register lead.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Server connection error.';
        errorDiv.style.display = 'block';
      }
    }

    // Helper to prevent XSS
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
